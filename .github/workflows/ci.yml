name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  HF_HOME: /tmp/.hf-cache
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: ${{ runner.os }}-uv-lint-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-lint-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with pyright
        run: uv run pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/.uv-cache
            /tmp/.hf-cache
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test with pytest
        run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=100

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # Emits the `gate` status context required by the paiml org ruleset
  # "Green Main" (id 13878864). Without a check literally named `gate`,
  # every PR in this repo reports mergeStateStatus: BLOCKED while all
  # visible checks are green.
  #
  # This is an aggregator, not a rubber stamp: it fails whenever any
  # upstream CI job failed, was cancelled, or was skipped, and it fails
  # if it ever finds itself aggregating nothing.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Aggregate upstream CI job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          printf '%s' "$NEEDS_JSON" | jq -e . > /dev/null \
            || { echo "gate: FAIL - could not parse the needs context"; exit 1; }

          total=$(printf '%s' "$NEEDS_JSON" | jq 'length')
          echo "gate: aggregated ${total} upstream CI job(s)"
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          # A gate that measures nothing must not read as a pass.
          if [ "$total" -eq 0 ]; then
            echo "gate: FAIL - aggregated 0 jobs; this gate would be a no-op"
            exit 1
          fi

          # Pin the denominator: if a job is dropped from `needs:` above,
          # the gate fails loudly instead of silently guarding less.
          for job in lint test; do
            printf '%s' "$NEEDS_JSON" | jq -e --arg j "$job" 'has($j)' > /dev/null \
              || { echo "gate: FAIL - expected upstream job '${job}' is missing from needs"; exit 1; }
          done

          bad=$(printf '%s' "$NEEDS_JSON" \
            | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$bad" ]; then
            echo "gate: FAIL - upstream job(s) did not succeed: ${bad}"
            exit 1
          fi

          echo "gate: PASS - all ${total} upstream job(s) succeeded"
